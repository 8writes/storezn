name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's restricted deploy key accepts only the registered
          # application name; it rejects arbitrary shell commands.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@204.168.144.211 "storezn"
